#The solution's localized description. Only <br> and <a> are used: keep it to those tags.
DESCRIPTION=This Management Pack brings additional collection and enhance the capacity management. It publishes what it finds on the vCenter objects you already monitor, under the vCommunity| prefix.<br><br>Why it helps:<br>• Catch configuration drift. A changed host setting, VM parameter or cluster setting becomes a property you can alert on, report on and check against a compliance template.<br>• Check your hardening guide or config workbook.<br>• Answer capacity questions. Each cluster gets Cluster Performance, Cluster Risk and Cluster Consumption scores, and a Close for Business value that says whether it is full for new VMs.<br>• Explain every score. Each KPI is built from visible sub-metrics, so you can see which one is driving it.<br>• Stay agentless. Nothing is installed on ESXi hosts or on vCenter. Windows checks use the vSphere Guest API.<br><br>What it collects and calculates:<br>• ESXi advanced system settings, software packages (VIBs) and host licensing<br>• VM advanced parameters, VM options, disks and shares<br>• Cluster HA, DRS, DPM and EVC settings<br>• vCenter certificate tracking, with a status that shows when it changes<br>• Operational Availability and Network Speed Degradation<br>• KPIs for clusters, VMs and ESXi hosts, with a summary across all vCenters on the vSphere World object<br>• Microsoft Windows services and Windows event logs<br>• Dashboards, reports and super metrics, ready to use<br><br>You choose what is collected:<br>Each list of settings is an XML file. Clone it for each environment, and start with the few settings from your hardening guide. Add more over time, without a new release.<br><br>Before you start:<br>• Needs VCF Operations Cloud Proxy that can reach vCenter.<br>• Activate the packet counters and the NIC configured speed in the policy. They are off by default.<br>• Windows checks add load to VCF Operations and to each Windows VM. Turn them on selectively.<br><br>How it works with the other parts:<br>This adapter is one of three parts that work together, all built on one body of knowledge: the concepts, framework and practice of the book Private Cloud Management.<br>• Agent E2 holds that knowledge in a form an AI model reads, and answers questions with it. Every KPI, threshold and metric name this adapter publishes comes from Agent E2.<br>• This adapter calculates those KPIs from your VCF Operations data and publishes them on your vCenter objects.<br>• Private Cloud Manager (PCM) is the web application for your operations team, available as a demo today. It reads the KPIs from VCF Operations and asks Agent E2 to explain them for the object on screen.<br>• <a href="https://isvara.io" target="_blank">isvara.io</a> is the public website where your team learns the same knowledge: articles, tools, practice, and questions to Agent E2.<br><br>Alone, the adapter gives you the KPIs in VCF Operations. With Agent E2 and PCM, each KPI comes with what it means and what to check next. isvara.io teaches your team to read them. Download the book at <a href="https://isvara.io/download" target="_blank">isvara.io/download</a>.<br><br>This is a free community project. It is not an official VMware or Broadcom product, and it has no VMware GSS support. Deploy it at your own risk. Documentation and source code: <a href="https://github.com/e1-rahabok/PCM-Adapter" target="_blank">https://github.com/e1-rahabok/PCM-Adapter</a>

